<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch Party</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #080b1d;
      color: white;
      overflow: hidden;
    }

    .app {
      height: 100dvh;
      max-width: 900px;
      margin: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .header {
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px;
    }

    .brand {
      font-size: 24px;
      font-weight: bold;
    }

    .brand span {
      color: #b34cff;
    }

    .room {
      font-size: 13px;
      color: #bcb8cc;
      margin-top: 3px;
    }

    .menu-btn {
      border: 1px solid #6740a8;
      background: #17132e;
      color: white;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      font-size: 22px;
      cursor: pointer;
    }
</style>
</head>

<body>
  <div class="app">

    <div class="header">
      <div>
        <div class="brand">🎬 Watch <span>Party</span></div>
        <div class="room" id="roomText">Room: Not connected</div>
      </div>

      <button class="menu-btn">⋮</button>
    </div>

    <div class="video-box">
      <div class="empty-video" id="emptyVideo">
        <h2>Ready to Watch?</h2>
        <p>Add a video to start your Watch Party.</p>
        <button class="add-btn" onclick="addVideo()">＋ Add Video</button>
      </div>

      <video id="video" playsinline></video>

      <div class="video-controls">
        <button class="control" onclick="skip(-10)">⏪</button>
        <button class="control" onclick="togglePlay()" id="playBtn">▶</button>
        <button class="control" onclick="skip(10)">⏩</button>
        <button class="control sync-btn" onclick="syncVideo()">↻ Sync</button>
        <button class="control" onclick="fullScreen()">⛶</button>
      </div>
    </div>

    <style>
      .video-box {
        flex: 1;
        min-height: 180px;
        position: relative;
        overflow: hidden;
        border-radius: 18px;
        background: #000;
        border: 1px solid #7a38d4;
      }

      video {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }

      .empty-video {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #15122e, #050713);
        color: #c7c1d5;
        text-align: center;
        gap: 12px;
      }

      .add-btn {
        border: none;
        background: linear-gradient(90deg, #7228ff, #a83cff);
        color: white;
        padding: 12px 18px;
        border-radius: 12px;
        font-weight: bold;
        cursor: pointer;
      }

      .video-controls {
        position: absolute;
        left: 8px;
        right: 8px;
        bottom: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 8px;
        border-radius: 14px;
        background: rgba(0, 0, 0, 0.7);
      }

      .control {
        min-width: 42px;
        height: 42px;
        border-radius: 50%;
        border: 1px solid #8b65c7;
        background: #21173b;
        color: white;
        font-size: 17px;
        cursor: pointer;
      }

      .sync-btn {
        width: auto;
        padding: 0 13px;
        border-radius: 22px;
      }
    </style>

    <div class="chat">
      <div class="chat-header">💬 Live Chat</div>

      <div id="messages">
        <div class="message">Welcome to Watch Party! 👋</div>
      </div>

      <div class="chat-input">
        <input
          id="messageInput"
          type="text"
          placeholder="Type a message..."
          onkeydown="if(event.key === 'Enter') sendMessage()"
        >
        <button class="send-btn" onclick="sendMessage()">Send</button>
      </div>
    </div>

    <style>
      .chat {
        height: 185px;
        background: #101126;
        border: 1px solid #5f3a9b;
        border-radius: 16px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      .chat-header {
        padding: 10px 14px;
        font-weight: bold;
        border-bottom: 1px solid #30264b;
      }

      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 8px 12px;
      }

      .message {
        background: #2b2347;
        width: fit-content;
        max-width: 85%;
        padding: 7px 11px;
        margin-bottom: 6px;
        border-radius: 10px;
        font-size: 14px;
        word-break: break-word;
      }

      .chat-input {
        display: flex;
        gap: 6px;
        padding: 8px;
        border-top: 1px solid #30264b;
      }

      .chat-input input {
        flex: 1;
        min-width: 0;
        background: #080919;
        color: white;
        border: 1px solid #51406f;
        border-radius: 10px;
        padding: 10px;
        outline: none;
      }

      .send-btn {
        border: none;
        background: #7b2cff;
        color: white;
        border-radius: 10px;
        padding: 0 15px;
        font-weight: bold;
        cursor: pointer;
      }
    </style>

    <script>
      const video = document.getElementById("video");
      const emptyVideo = document.getElementById("emptyVideo");
      const playBtn = document.getElementById("playBtn");

      function addVideo() {
        const url = prompt("Paste your direct video link:");

        if (!url) return;

        video.src = url;
        emptyVideo.style.display = "none";
        video.load();
      }

      function togglePlay() {
        if (!video.src) {
          alert("Please add a video first.");
          return;
        }

        if (video.paused) {
          video.play();
        } else {
          video.pause();
        }
      }

      function skip(seconds) {
        if (!video.src) return;

        video.currentTime = Math.max(
          0,
          video.currentTime + seconds
        );
      }

      function syncVideo() {
        if (!video.src) {
          alert("Please add a video first.");
          return;
        }

        alert("Firebase sync will be added next.");
      }

      function fullScreen() {
        const videoBox = document.querySelector(".video-box");

        if (videoBox.requestFullscreen) {
          videoBox.requestFullscreen();
        }
      }

      video.addEventListener("play", function () {
        playBtn.textContent = "⏸";
      });

      video.addEventListener("pause", function () {
        playBtn.textContent = "▶";
      });

      function sendMessage() {
        const input = document.getElementById("messageInput");
        const text = input.value.trim();

        if (!text) return;

        const messages = document.getElementById("messages");
        const message = document.createElement("div");

        message.className = "message";
        message.textContent = text;

        messages.appendChild(message);
        messages.scrollTop = messages.scrollHeight;
        input.value = "";
      }
    </script>

  </div>
</body>
</html>
