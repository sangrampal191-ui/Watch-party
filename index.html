<style>
.join-card,
.members-card{
  margin-top:16px;
  padding:18px;
  border-radius:20px;
  background:rgba(18,19,48,.92);
  border:1px solid rgba(137,75,255,.5);
  box-shadow:0 0 20px rgba(92,36,200,.12);
}

.section-title{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:19px;
  font-weight:bold;
  margin-bottom:14px;
}

.party-input{
  width:100%;
  padding:14px;
  margin-bottom:10px;
  border-radius:12px;
  border:1px solid #4e4b72;
  background:#0d1025;
  color:white;
  font-size:16px;
  outline:none;
}

.party-input:focus{
  border-color:#a855f7;
  box-shadow:0 0 10px rgba(168,85,247,.35);
}

.connect-btn{
  width:100%;
  padding:15px;
  border:none;
  border-radius:15px;
  background:linear-gradient(135deg,#9333ea,#6d28d9);
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.connect-btn:active{
  transform:scale(.98);
}

/* MEMBERS */
.members-list{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.member{
  display:flex;
  align-items:center;
  gap:8px;
  padding:9px 12px;
  border-radius:14px;
  background:#10132b;
  border:1px solid #343060;
}

.member-avatar{
  width:34px;
  height:34px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:linear-gradient(135deg,#b026ff,#5b21b6);
  font-weight:bold;
}

.member-name{
  font-size:14px;
}

.member-status{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#00e676;
  box-shadow:0 0 7px #00e676;
}
</style>


<!-- JOIN PARTY -->
<section class="join-card">

  <div class="section-title">
    🔗 Join Watch Party
  </div>

  <input
    id="name"
    class="party-input"
    placeholder="Your name"
    maxlength="30"
  >

  <input
    id="room"
    class="party-input"
    placeholder="Enter Room ID"
    maxlength="60"
    value="dost123"
  >

  <button
    id="connectBtn"
    class="connect-btn"
    type="button"
  >
    ⚡ Connect to Party
  </button>

</section>


<!-- ONLINE MEMBERS -->
<section class="members-card">

  <div class="section-title">
    👥 Party Members
  </div>

  <div
    class="members-list"
    id="membersList"
  >

    <!-- शुरुआत में यह दिखाई देगा -->
    <div class="member">
      <div class="member-avatar">?</div>

      <div>
        <div class="member-name">
          Connect to see members
        </div>
      </div>

    </div>

  </div>

</section>
